spring.application.name=roadresq
server.port=${PORT:8080}
server.address=0.0.0.0

# Multipart / File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
roadresq.upload.dir=./uploads/problems

# Security & JWT Configuration (Min 256 bits secret for HMAC-SHA256)
roadresq.jwt.secret=${JWT_SECRET:RoadResQSecretKeyMustBeAtLeast256BitsLongForHmacSha256Security1234567890}
roadresq.jwt.expiration-ms=86400000

# CORS Configuration
roadresq.cors.allowed-origins=*

# Active profile: 'h2' for zero-config embedded database, 'mysql' for MySQL 8.0
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Disable raw sql init script auto-exec to let JPA manage DDL cleanly
spring.sql.init.mode=never
